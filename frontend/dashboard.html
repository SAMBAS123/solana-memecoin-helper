<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Solana Memecoin Helper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
    <h1>Solana Memecoin Helper</h1>
    <label>
        Token address:
        <input id="token" placeholder="Enter Token Address" />
    </label>
    <button onclick="scan()">Scan Holders</button>
    <button onclick="startMonitor()">Start Liquidity Monitor</button>
    <button onclick="testAlert()">Test Alert to Telegram</button>
    <pre id="out"></pre>

    <script>
        let alertsTimer = null;

        async function scan() {
            const token = document.getElementById('token').value.trim();
            const res = await fetch('http://127.0.0.1:5000/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
        }

        async function startMonitor() {
            const token = document.getElementById('token').value.trim();
            const res = await fetch('http://127.0.0.1:5000/monitor/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
            console.log('Monitoring started. Alerts will print in backend console.');
            if (!alertsTimer) {
                alertsTimer = setInterval(fetchAlerts, 5000);
            }
        }

        async function fetchAlerts() {
            try {
                const res = await fetch('http://127.0.0.1:5000/alerts');
                const data = await res.json();
                const pre = document.getElementById('out');
                pre.textContent = JSON.stringify(data, null, 2);
            } catch (e) {}
        }

        async function testAlert() {
            const res = await fetch('http://127.0.0.1:5000/test_alert');
            document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
        }
    </script>
</body>
</html>
